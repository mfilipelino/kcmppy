[project]
name = "kcmppy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "complexipy>=5.4.1",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.0",
    "radon>=6.0.1",
    "ruff>=0.15.13",
    "ty>=0.0.35",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "S", "C4", "SIM", "UP", "ARG", "PL", "C901"
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-nested-blocks = 4

[tool.ty.environment]
python-version = "3.11"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = []
